<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia — Momentum Derma | Arturo Alba</title>
    <link rel="icon" href="assets/images/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Campo de texto de la ciudad */
        .quiz__input {
            display: block;
            width: 100%;
            max-width: 30rem;
            background: none;
            border: none;
            border-bottom: 1px solid #ffffff;
            border-radius: 0;
            padding: 0.5rem 0;
            font-family: "Silka", sans-serif;
            font-size: 1.3rem;
            line-height: 1.5;
            color: #ffffff;
            margin: 0;
        }
        .quiz__input::placeholder { color: #ffffff; opacity: 0.45; }
        .quiz__input:focus { outline: none; border-bottom-color: var(--accent, #ff6b00); }
        .quiz__visual-image[hidden] { display: none; }
    </style>
</head>
<body class="quiz quiz--farmacia" data-question="farmacia">

<a href="index.html" class="quiz__restart">
    <span class="quiz__restart-arrow" aria-hidden="true">&#8592;</span>
    <span>Volver a empezar</span>
</a>

<div class="quiz__panel quiz__panel--visual">
    <img
            src="assets/images/test-0b-farmacia.png"
            alt=""
            class="quiz__visual-image"
            onerror="this.hidden=true">
</div>

<main class="quiz__panel quiz__panel--question">
    <div class="quiz__content">
        <h1 class="quiz__question">&#191;C&#243;mo se llama tu farmacia?</h1>

        <label class="sr-only" for="farmacia">Farmacia</label>
        <input type="text" id="farmacia" class="quiz__input" maxlength="80" autocomplete="off" placeholder="Escribe el nombre">
    </div>

    <a href="test-1.html" class="quiz__next" id="nextBtn" aria-disabled="true">
        <span>SIGUIENTE</span>
        <span class="quiz__next-arrow" aria-hidden="true">&#8594;</span>
    </a>
</main>

<script>
(function () {
    "use strict";
    var input = document.getElementById("farmacia");
    var nextBtn = document.getElementById("nextBtn");

    try {
        var previa = sessionStorage.getItem("farmacia");
        if (previa) input.value = previa;
    } catch (e) {}

    function actualizar() {
        var texto = input.value.trim();
        var valida = texto.length >= 2;
        try { sessionStorage.setItem("farmacia", texto); } catch (e) {}
        nextBtn.classList.toggle("is-active", valida);
        if (valida) nextBtn.removeAttribute("aria-disabled");
        else nextBtn.setAttribute("aria-disabled", "true");
    }

    input.addEventListener("input", actualizar);
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && nextBtn.classList.contains("is-active")) {
            window.location.href = nextBtn.getAttribute("href");
        }
    });
    nextBtn.addEventListener("click", function (e) {
        if (!nextBtn.classList.contains("is-active")) e.preventDefault();
    });

    actualizar();
})();
</script>
</body>
</html>
